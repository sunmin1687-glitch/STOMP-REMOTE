<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stomp Remote · 울트라</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0c0d0f">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stomp">
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{}));var hadSW=!!navigator.serviceWorker.controller,reloaded=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadSW&&!reloaded){reloaded=true;location.reload();}});}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
:root{
  --bg:#0C0D0F; --card:#15171B; --raise:#1D2025; --line:#23262C; --track:#2A2D33;
  --fg:#F3F4F6; --mute:#9BA1AC; --soft:#C9CED6; --acc:#D4F25A; --on-acc:#12140A; --del:#FF8A7E;
  --sans:'Inter','Noto Sans KR',system-ui,-apple-system,sans-serif; --num:'Inter','Noto Sans KR',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
body.v-iface #test{display:none}
body.v-test #iface{display:none}

/* ---------- 테스트 화면 ---------- */
#test{max-width:480px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 18px 40px;display:flex;flex-direction:column;gap:16px}
#test h1{font-size:22px;margin:0}
#test p{margin:0;color:var(--mute);font-size:14px;line-height:1.5}
#test .big{height:56px;border-radius:16px;border:none;background:var(--acc);color:var(--on-acc);font-size:16px;font-weight:700}
#test .big:disabled{background:var(--track);color:var(--mute)}
#test .ghost{height:52px;border-radius:16px;border:1px solid var(--line);background:var(--card);font-size:15px;font-weight:500}
#test .card{background:var(--card);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
#test .row{display:flex;justify-content:space-between;gap:12px;font-size:14px}
#test .row span:first-child{color:var(--mute)}
.ok{color:var(--acc);font-weight:700}
.bad{color:var(--del);font-weight:700}
#test pre{margin:0;white-space:pre-wrap;word-break:break-all;font-size:12px;color:var(--soft);background:var(--bg);border-radius:10px;padding:10px}

/* ---------- 인터페이스 공통 ---------- */
#iface{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:max(16px,env(safe-area-inset-top)) 18px max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px;user-select:none;-webkit-user-select:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.badge{display:flex;align-items:center;gap:8px;font-family:var(--num);font-size:12px;letter-spacing:.12em;color:var(--mute)}
.badge i{width:6px;height:6px;border-radius:50%;background:var(--acc)}
.badge.demo i{background:#F5B248}
.round{width:44px;height:44px;border-radius:50%;border:none;background:var(--card);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chip{height:36px;padding:0 12px;white-space:nowrap;border-radius:999px;border:none;background:var(--card);color:var(--mute);font-size:12px}
.label{font-family:var(--num);font-size:11px;letter-spacing:.16em;color:var(--mute)}
.linkbtn{border:none;background:none;color:var(--acc);font-size:14px;padding:10px 0 10px 12px;font-weight:500}
.linkbtn.muted{color:var(--mute);padding:10px 12px 10px 0;font-weight:400}
.title{font-size:16px;font-weight:700}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hero .id{font-family:var(--num);font-size:13px;color:var(--mute);letter-spacing:.08em}
.hero .name{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.15;word-break:keep-all}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;background:var(--card);border-radius:16px;padding:4px}
.seg button{height:44px;border-radius:12px;border:none;background:transparent;color:var(--mute);font-size:14px}
.seg button.on{background:var(--acc);color:var(--on-acc);font-weight:700}
.seg.light button.on{background:var(--fg);color:var(--bg)}
.sw{width:48px;height:28px;border-radius:999px;border:none;background:var(--track);position:relative;padding:0;flex-shrink:0;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--mute);transition:left .15s,background .15s}
.sw.on{background:var(--acc)}
.sw.on::after{left:23px;background:var(--on-acc)}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.cat{font-size:11px;color:var(--mute)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 메인 체인 */
.chain{position:relative;display:flex;flex-direction:column}
.chain::before{content:"";position:absolute;left:16px;top:24px;bottom:24px;width:1px;background:var(--track)}
.crow{display:flex;align-items:center;gap:10px;height:54px;position:relative}
.crow .open{flex:1;min-width:0;height:100%;display:flex;align-items:center;gap:14px;border:none;background:none;padding:0;text-align:left}
.node{width:12px;height:12px;margin:0 5px;border-radius:50%;box-shadow:0 0 0 4px var(--bg);flex-shrink:0}
.node.off{width:12px;height:12px;background:var(--bg)!important;border:2px solid}
.crow .nm{font-size:15px;font-weight:500}
.crow.off .nm{color:var(--mute)}
.dock{position:sticky;bottom:0;z-index:10;margin:auto -18px 0;padding:18px 18px max(10px,env(safe-area-inset-bottom));background:linear-gradient(rgba(12,13,15,0),var(--bg) 22px)}
.bar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
/* RTA */
.rta{background:var(--card);border-radius:16px;padding:10px 8px 6px}
.rta canvas{display:block;width:100%;height:272px;touch-action:none}
.rstrip{display:flex;align-items:center;gap:3px;margin:0 2px 8px;min-height:26px}
.rstrip button{border:none;background:none;padding:0;display:flex;border-radius:9px}
.rstrip .wire{width:6px;height:1px;background:#30353D;flex-shrink:0}
.rstrip .sel{box-shadow:0 0 0 2px #0F1114,0 0 0 3.5px #8FDB7A}
.rstrip .meta{margin-left:auto;display:flex;align-items:center;gap:6px;font-family:var(--num);font-size:10.5px;color:#7C838E;white-space:nowrap}
.rstrip .meta i{width:6px;height:6px;border-radius:50%;background:#5BD18A;display:inline-block;margin-right:4px}
.rstrip .meta.paused i{background:#7C838E}
.srcseg{margin-left:auto;display:flex;flex-shrink:0;background:var(--card);border-radius:10px;padding:3px}
.srcseg button{border:none;background:none;color:#7C838E;font-size:12.5px;padding:7px 11px;border-radius:8px;white-space:nowrap}
.srcseg button.on{background:#E9EDF2;color:#0C0D0F;font-weight:700}
.readout{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ro{background:var(--card);border-radius:12px;padding:9px 11px;display:flex;flex-direction:column;gap:2px;min-width:0}
.ro small{font-size:11px;color:#7C838E}
.ro b{font-family:var(--num);font-size:17px;font-weight:500;white-space:nowrap}
.ro b em{font-style:normal;font-size:11.5px;color:#7C838E}
.bal{background:var(--card);border-radius:12px;padding:9px 11px}
.bal .hd,.bal .ft{display:flex;justify-content:space-between;font-size:11px;color:#7C838E}
.bal .ft{font-family:var(--num);font-size:12px;color:var(--fg);margin-top:5px}
.bal .bar3{display:flex;height:6px;border-radius:3px;overflow:hidden;gap:2px;margin-top:6px}
.bal .bar3 i{display:block;transition:flex-grow .3s}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tools .spd{display:flex;background:var(--card);border-radius:999px;padding:3px}
.tools .spd button{border:none;background:none;color:#7C838E;font-size:12.5px;padding:7px 11px;border-radius:999px}
.tools .spd button.on{background:#2A2E35;color:var(--fg)}
.tools .t{height:38px;padding:0 13px;border-radius:999px;border:none;background:var(--card);color:var(--soft);font-size:12.5px}
.tools .t.on{background:#E9EDF2;color:#0C0D0F;font-weight:700}
.stick{position:sticky;top:0;z-index:10;margin:-16px -18px 0;padding:max(16px,env(safe-area-inset-top)) 18px 12px;background:var(--bg);display:flex;flex-direction:column;gap:12px}
.bicon{display:block;flex-shrink:0;border-radius:9px;box-shadow:0 0 0 4px var(--bg)}
.bar button{height:58px;border-radius:16px;border:none;background:var(--card);font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.bar .bpm{font-family:var(--num);font-size:18px;font-weight:700}
.bar small{font-size:11px;color:var(--mute)}

/* 편집 */
.notice{display:flex;gap:10px;align-items:center;background:#1A1D12;border-radius:14px;padding:10px 12px;font-size:12px;color:#DDE5B8;line-height:1.4}
.meter{height:6px;border-radius:999px;background:var(--raise);overflow:hidden}
.meter i{display:block;height:100%;border-radius:999px;background:var(--acc);transition:width .2s}
.meter.full i{background:var(--del)}
.erow{display:flex;align-items:center;gap:10px;height:56px;background:var(--card);border-radius:14px;padding:0 4px 0 12px}
.erow .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.ibtn{width:40px;height:44px;border-radius:10px;border:none;background:transparent;color:var(--soft);display:flex;align-items:center;justify-content:center;padding:0}
.ibtn:disabled{opacity:.25}
.ibtn.del{color:var(--del)}
.ins{height:30px;border:none;background:none;color:var(--mute);font-size:12px;display:flex;align-items:center;justify-content:center;gap:6px;width:100%}
.ins:active,.ins:hover{color:var(--acc)}
.full{font-size:12px;color:var(--mute);text-align:center;padding:6px 0}

/* 추가 */
.search{display:flex;align-items:center;gap:10px;height:48px;background:var(--card);border-radius:14px;padding:0 14px}
.search input{flex:1;background:transparent;border:none;outline:none;color:var(--fg);font-family:var(--sans);font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{height:36px;padding:0 14px;border-radius:999px;border:none;background:var(--card);color:var(--soft);font-size:13px;display:flex;align-items:center;gap:6px}
.chips button.on{background:var(--fg);color:var(--bg);font-weight:700}
.models{display:flex;flex-direction:column;gap:6px}
.models button{min-height:56px;border-radius:14px;border:1.5px solid transparent;background:var(--card);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px 0 12px;font-size:15px;text-align:left}
.models button.on{border-color:var(--acc);font-weight:700}
.cta{height:56px;border-radius:16px;border:none;background:var(--acc);color:var(--on-acc);font-size:15px;font-weight:700;width:100%}
.cta:disabled{background:var(--track);color:var(--mute)}
.empty{color:var(--mute);font-size:14px;text-align:center;padding:20px 0}

/* 블록 편집 */
.graph{background:var(--card);border-radius:22px;padding:12px 8px 6px;touch-action:none}
.gcap{font-size:12px;color:var(--soft);padding:0 8px 4px;min-height:18px}
.graph svg{display:block;width:100%;height:auto}
.params{display:flex;flex-direction:column;gap:16px}
.param .hd{display:flex;justify-content:space-between;align-items:baseline}
.param label{font-size:13px;color:var(--mute)}
.param .v{font-family:var(--num);font-size:22px;font-weight:700;letter-spacing:-.02em}
.param input{width:100%;margin:4px 0 0;height:30px;accent-color:var(--acc)}
.hint{font-size:12px;color:var(--mute);text-align:center}

/* 연결·프리셋 */
.dev{background:var(--card);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px}
.kv{display:flex;justify-content:space-between;font-size:13px}
.kv span:last-child{color:var(--mute);font-family:var(--num)}
.sep{border-top:1px solid var(--line);padding-top:14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.plist{display:flex;flex-direction:column;gap:2px}
.plist button{min-height:50px;border-radius:14px;border:none;background:transparent;display:flex;align-items:center;gap:14px;padding:0 14px;font-size:15px;text-align:left}
.plist button .pid{font-family:var(--num);font-size:13px;color:var(--mute);width:34px}
.plist button.on{background:var(--card);font-weight:700}
.plist button.on .pid{color:var(--acc)}

/* 조작 안내 */
.tip{background:#1A1D12;border-radius:16px;padding:12px 8px 12px 14px;display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.6;color:#DDE5B8}
.tip ul{margin:0;padding-left:16px;flex:1}
.tip b{color:var(--acc);font-weight:700}
.tip .x{width:36px;height:36px;border:none;background:none;color:#DDE5B8;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:-6px;padding:0}
.help{width:44px;height:44px;border-radius:50%;border:none;background:var(--card);color:var(--soft);font-family:var(--num);font-size:16px;font-weight:700;flex-shrink:0}
.state{font-family:var(--num);font-size:11px;letter-spacing:.06em;color:var(--mute);width:28px;text-align:right}
.crow.on .state{color:var(--acc)}
.chev{color:var(--mute);flex-shrink:0;margin-left:auto}
.pname{border:none;background:none;padding:0;text-align:left;display:flex;align-items:center;gap:6px;min-width:0}
.pname svg{color:var(--mute);flex-shrink:0;margin-top:6px}
/* 드래그 순서 변경 */
.grip{width:44px;height:56px;margin-left:-10px;border:none;background:none;padding:0;display:flex;align-items:center;justify-content:center;color:var(--soft);touch-action:none;cursor:grab;flex-shrink:0}
.elist{display:flex;flex-direction:column;touch-action:pan-y}
.elist.dragging .ins{display:none}
.elist.dragging .erow{margin-bottom:6px;transition:transform .16s ease}
.erow.lift{position:relative;z-index:5;transition:none!important;background:var(--raise);box-shadow:0 12px 30px rgba(0,0,0,.55),0 0 0 1.5px var(--acc);cursor:grabbing}
@keyframes pulse{0%{r:14;opacity:.6}100%{r:26;opacity:0}}
.pulse{animation:pulse 1.4s ease-out infinite;fill:none;stroke:#D4F25A;stroke-width:2}

.toast{position:fixed;left:50%;top:max(16px,env(safe-area-inset-top));transform:translate(-50%,-12px);max-width:calc(100% - 32px);padding:12px 16px;border-radius:12px;background:var(--fg);color:var(--bg);font-size:13px;line-height:1.5;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- v10 메인 ---------- */
#iface.mainv{gap:10px}
.mtop{display:flex;align-items:center;gap:6px;min-height:38px}
.mode{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--mute);white-space:nowrap;margin-right:auto}
.mode i{width:6px;height:6px;border-radius:2px;background:#F5B248}
.tile{height:36px;border-radius:11px;border:none;background:var(--card);display:flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;font-size:13px;font-weight:500;color:#D5D9DF;flex-shrink:0}
.tile.sq{width:36px;padding:0}
.tile.nav{width:40px;height:40px;padding:0;color:#E9EDF2}
.tile b{font-weight:800;font-size:15px}
.tile small{font-size:10px;letter-spacing:.12em;color:var(--mute);font-weight:600}
.tile.link{box-shadow:inset 0 0 0 1.5px rgba(212,242,90,.6)}
.tile.link b{color:var(--acc)}
.cap6{font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--mute)}
.mhero{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.mhero .name{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.15;word-break:keep-all}
.rta{position:relative}
.rhd{display:flex;align-items:center;gap:6px;margin:0 4px 6px}
.rhd .t2{height:28px;border-radius:8px;border:none;background:#0D0F12;padding:0 10px;font-size:12px;font-weight:500;color:#C9CED6;white-space:nowrap}
.rhd .live{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:var(--mute)}
.rhd .live i{width:6px;height:6px;border-radius:2px;background:#5BD18A}
.rhd .live.idle i{background:#5E646E}
.pop{position:absolute;top:40px;z-index:6;background:#1D2025;border-radius:12px;padding:4px;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.6);min-width:120px}
.pop button{height:40px;border:none;background:none;border-radius:9px;text-align:left;padding:0 12px;font-size:13.5px;color:var(--soft)}
.pop button.on{background:#2A2E35;color:var(--fg);font-weight:700}
.rta-off{position:absolute;left:0;right:0;top:44px;bottom:24px;display:flex;align-items:center;justify-content:center;gap:8px}
.rta-off button{height:40px;border-radius:11px;border:none;padding:0 14px;font-size:13px;font-weight:700;background:#E9EDF2;color:#0C0D0F}
.rta-off button.g{background:#2A2E35;color:var(--fg);font-weight:500}
.bal2{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:9px 12px;font-size:12px;color:var(--mute);white-space:nowrap}
.bal2 .b3{flex:1;display:flex;height:5px;border-radius:3px;overflow:hidden;gap:2px;min-width:40px}
.bal2 .b3 i{display:block;transition:flex-grow .3s}
.bal2 b{color:var(--fg);font-weight:600;font-size:12.5px;margin-left:2px}
.strip{display:flex;align-items:flex-start;gap:6px}
.strip .sx{flex:1;min-width:0;display:flex;align-items:flex-start;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.strip .sx::-webkit-scrollbar{display:none}
.blk{position:relative;border:none;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0;width:36px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.blk .bicon{box-shadow:none}
.blk small{font-size:10.5px;font-weight:600;letter-spacing:.06em;color:var(--soft)}
.blk.off small{opacity:.55}
.blk .x{position:absolute;top:-5px;right:-3px;width:18px;height:18px;border-radius:6px;background:#FF8A7E;color:#12140A;font-size:13px;font-weight:800;line-height:18px;text-align:center}
.sedit .blk{touch-action:none}
.blk.lift{z-index:3;filter:drop-shadow(0 8px 10px #000)}
.strip .wire{width:7px;height:1.5px;background:#33373F;margin-top:17px;flex-shrink:0;border-radius:1px}
.pen{width:36px;height:36px;border-radius:11px;border:none;background:var(--card);color:var(--mute);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.plusb{width:36px;height:36px;border-radius:11px;border:1.5px dashed #3A3F47;background:none;color:var(--mute);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-left:6px}
.ebar{display:flex;align-items:center;gap:8px;margin-bottom:-4px}
.ebar span{font-size:11.5px;color:var(--mute);margin-right:auto}
.ebar button{height:30px;border-radius:9px;border:none;padding:0 12px;font-size:12.5px;font-weight:600;background:var(--card);color:var(--soft)}
.ebar button.ok{background:var(--acc);color:var(--on-acc);font-weight:700}
.met{display:flex;flex-direction:column;gap:8px;flex:1}
.mh{display:flex;align-items:center;gap:8px}
.mh .mi{font-size:11px;font-weight:500;color:var(--mute)}
.pl{margin-left:auto;height:34px;min-width:78px;border:none;border-radius:11px;background:var(--acc);color:var(--on-acc);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 13px}
.pl.go{background:#E9EDF2;color:#0C0D0F}
.songs{display:flex;gap:6px;overflow-x:auto;margin-right:-18px;padding-right:18px;scrollbar-width:none}
.songs::-webkit-scrollbar{display:none}

<body class="v-test">

<!-- ================= 테스트 화면 ================= -->
<main id="test">
  <h1>USB 연결 테스트</h1>
  <p>HX Stomp가 WebUSB로 잡히는지만 확인해요. 페달에는 아무 데이터도 보내지 않아요 (연결 → 정보 읽기 → 바로 해제).</p>

  <div class="card">
    <div class="row"><span>WebUSB 지원</span><span id="webusb">확인 중…</span></div>
    <div class="row"><span>Web MIDI 지원</span><span id="webmidi">확인 중…</span></div>
  </div>

  <button class="big" id="go">1. HX Stomp 찾기 (USB)</button>
  <button class="big" id="midi">2. MIDI도 같이 잡히는지 확인</button>

  <div class="card">
    <div class="row"><span>결과</span><span id="summary">아직 실행 안 함</span></div>
    <pre id="log"></pre>
  </div>

  <p>끝나면 결과 칸 내용을 통째로 복사해서 Claude에게 보내 주세요.</p>
  <button class="ghost" id="toIface">인터페이스 둘러보기 (연습 모드)</button>
</main>

<!-- ================= 인터페이스 ================= -->
<div id="iface"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------------- 테스트 화면 (페달에 데이터 보내지 않음) ---------------- */
(function(){
const logEl = document.getElementById('log');
const summaryEl = document.getElementById('summary');
function log(msg) { logEl.textContent += msg + '\n'; }
function hex(n, w) { return '0x' + n.toString(16).toUpperCase().padStart(w || 4, '0'); }
function setSummary(text, good) { summaryEl.textContent = text; summaryEl.className = good ? 'ok' : 'bad'; }

const hasUsb = 'usb' in navigator;
const hasMidi = 'requestMIDIAccess' in navigator;
document.getElementById('webusb').innerHTML = hasUsb ? '<span class="ok">지원</span>' : '<span class="bad">미지원</span>';
document.getElementById('webmidi').innerHTML = hasMidi ? '<span class="ok">지원</span>' : '<span class="bad">미지원</span>';
if (!hasUsb) {
  document.getElementById('go').disabled = true;
  log('이 브라우저는 WebUSB를 지원하지 않아요. 안드로이드 Chrome으로 열어 주세요.');
}
log('브라우저: ' + navigator.userAgent);

// Line 6 vendor ID. 0x4246 = HX Stomp, 0x4253 = HX Stomp XL (public USB logs / OpenHX docs)
const LINE6_VENDOR = 0x0E41;

document.getElementById('go').addEventListener('click', async () => {
  logEl.textContent = '';
  let device;
  try {
    device = await navigator.usb.requestDevice({ filters: [{ vendorId: LINE6_VENDOR }] });
  } catch (e) {
    setSummary('장치 선택 안 됨', false);
    log('requestDevice 오류: ' + e.name + ' – ' + e.message);
    log('목록에 HX Stomp가 안 보였다면: 케이블 연결, 페달 전원, 다른 USB-C 케이블을 확인해 주세요.');
    return;
  }
  log('장치 이름: ' + (device.productName || '(이름 없음)'));
  log('제조사: ' + (device.manufacturerName || '(없음)'));
  log('VID/PID: ' + hex(device.vendorId) + ' / ' + hex(device.productId));
  log('USB 버전: ' + device.usbVersionMajor + '.' + device.usbVersionMinor);

  let claimed = null;
  try {
    await device.open();
    log('open(): 성공');
    if (device.configuration === null) {
      await device.selectConfiguration(1);
      log('selectConfiguration(1): 성공');
    }
    const ifaces = device.configuration.interfaces;
    log('인터페이스 개수: ' + ifaces.length);
    let vendorIface = null;
    for (const itf of ifaces) {
      const alt = itf.alternate;
      const eps = alt.endpoints.map(ep => ep.direction + ' #' + ep.endpointNumber + ' ' + ep.type).join(', ');
      log('  - 인터페이스 ' + itf.interfaceNumber + ': class ' + hex(alt.interfaceClass, 2) +
          ' (' + (alt.interfaceName || '') + ') 엔드포인트[' + eps + ']');
      if (alt.interfaceClass === 0xFF && vendorIface === null) vendorIface = itf.interfaceNumber;
    }
    if (vendorIface === null) {
      setSummary('전용 통로 못 찾음', false);
      log('제조사 전용(class 0xFF) 인터페이스가 없어요.');
    } else {
      try {
        await device.claimInterface(vendorIface);
        claimed = vendorIface;
        setSummary('성공! 전용 통로 사용 가능', true);
        log('claimInterface(' + vendorIface + '): 성공 → 상태 읽기 개발 가능');
      } catch (e) {
        setSummary('전용 통로 잠김', false);
        log('claimInterface(' + vendorIface + ') 실패: ' + e.name + ' – ' + e.message);
      }
    }
  } catch (e) {
    setSummary('연결 실패', false);
    log('오류: ' + e.name + ' – ' + e.message);
  } finally {
    try { if (claimed !== null) await device.releaseInterface(claimed); } catch (e) {}
    try { await device.close(); log('연결 해제 완료 (페달에 보낸 데이터 없음)'); } catch (e) {}
  }
});

document.getElementById('midi').addEventListener('click', async () => {
  if (!hasMidi) { log('Web MIDI 미지원'); return; }
  try {
    const access = await navigator.requestMIDIAccess();
    const ins = [...access.inputs.values()].map(p => p.name);
    const outs = [...access.outputs.values()].map(p => p.name);
    log('MIDI 입력: ' + (ins.length ? ins.join(', ') : '없음'));
    log('MIDI 출력: ' + (outs.length ? outs.join(', ') : '없음'));
  } catch (e) {
    log('MIDI 오류: ' + e.name + ' – ' + e.message);
  }
});
})();
</script>

function vEdit(){
  const d = S.draft, dsp = dspOf(d), full = d.length >= MAX_BLOCKS;
  const ins = i => full ? '' : `<button class="ins" data-act="insertAt" data-i="${i}">${I.plus}여기에 추가</button>`;
  let list = ins(0);
  d.forEach((b,i) => {
    const c = CATS[b.cat];
    list += `<div class="erow">
      <button class="grip" data-i="${i}" aria-label="${esc(b.model)} 순서 바꾸기: 꾹 잡고 위아래로 끌기">${I.grip}</button>
      ${icon(b.cat, false, 30)}
      <span class="txt"><span class="ell" style="font-size:14px;font-weight:500">${esc(b.model)}</span><span class="cat">${c.name}</span></span>
      <button class="ibtn del" data-act="remove" data-i="${i}" aria-label="${esc(b.model)} 삭제">${I.trash}</button>
    </div>` + ins(i+1);
  });
  return `
  <div class="stick">
  <div class="top">
    <button class="linkbtn muted" data-act="cancelEdit">취소</button>
    <span class="title">체인 편집</span>
    <button class="linkbtn" data-act="doneEdit" style="font-weight:700">완료</button>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px">
    <div style="display:flex;justify-content:space-between;font-size:12px"><span style="color:var(--mute)">DSP 사용량 (예상치)</span><span style="font-family:var(--num)">${dsp}% · 블록 ${d.length}/${MAX_BLOCKS}</span></div>
    <div class="meter ${dsp>100?'full':''}"><i style="width:${Math.min(dsp,100)}%"></i></div>
  </div>
  </div>
    ${tip('edit')}
  <div class="notice">${I.shield}<span>완료를 눌러야 적용돼요<br>연습 모드라 페달에는 보내지 않아요</span></div>
<div class="elist" id="elist">${list}</div>
  ${full?'<div class="full">블록이 가득 찼어요 (최대 8개). 하나를 지워야 추가할 수 있어요.</div>':''}
  ${d.length===0?'<div class="empty">블록을 모두 지웠어요. 위의 "여기에 추가"로 넣어 보세요.</div>':''}`;
}

function vAdd(){
  const q = S.addQuery.trim().toLowerCase();
  let models;
  if (q) {
    models = [];
    CAT_ORDER.forEach(k => CATS[k].models.forEach(m => { if (m.toLowerCase().includes(q) || CATS[k].name.includes(q)) models.push([k,m]); }));
  } else {
    models = CATS[S.addCat].models.map(m => [S.addCat, m]);
  }
  const prev = S.draft[S.insertAt-1], next = S.draft[S.insertAt];
  const where = `${prev?esc(prev.model):'입력'} <span style="color:var(--mute)">→</span> <b style="color:var(--acc)">새 블록</b> <span style="color:var(--mute)">→</span> ${next?esc(next.model):'출력'}`;
  return `
  <div class="top">
    <button class="round" data-act="go" data-to="${S.sedit ? 'main' : 'edit'}" aria-label="닫기">${I.close}</button>

  </div>

  <div style="display:flex;flex-direction:column;gap:4px"><span class="label">위치</span><span style="font-size:15px">${where}</span></div>

  </div>
  <div class="models">
    ${models.length ? models.map(([k,m]) => { const on = S.addModel===m && (q || S.addCat===k);
      return `<button class="${on?'on':''}" data-act="pickModel" data-k="${k}" data-m="${esc(m)}"><span style="display:flex;align-items:center;gap:12px;min-width:0">${icon(k,false,30)}<span style="display:flex;flex-direction:column"><span>${esc(m)}</span>${q?`<span class="cat">${CATS[k].name}</span>`:''}</span></span>${on?I.check:''}</button>`; }).join('')

}

function vBlock(){
  const b = S.chain.find(x => x.uid === S.blockUid);
  if (!b) { S.screen = 'main'; return vMain(); }
  const c = CATS[b.cat], isOff = !!S.off[S.snap][b.uid];
  const head = `
  <div class="top" style="justify-content:flex-start;gap:12px">
    <button class="round" data-act="go" data-to="main" aria-label="메인으로">${I.back}</button>
    ${icon(b.cat, isOff, 40)}
    <div style="flex:1;display:flex;flex-direction:column;min-width:0">
      <span class="label" style="color:${c.color}">${c.name.toUpperCase()} · BLOCK ${S.chain.indexOf(b)+1}</span>
      <span class="ell" style="font-size:20px;font-weight:800;letter-spacing:-.02em">${esc(b.model)}</span>
    </div>
    <button class="sw ${isOff?'':'on'}" data-act="toggleBlock" data-uid="${b.uid}" aria-label="블록 ${isOff?'켜기':'끄기'}"></button>
  </div>`;
  return head + tip(b.cat === 'eq' ? 'eq' : 'block') + blockParts(b);
}
function blockParts(b){
  if (b.imp && !(b.cat === 'eq' && b.bands)) return rawParts(b);
  const c = CATS[b.cat];
  const graph = `<div class="graph" style="border:1px solid ${c.color}33"><div class="gcap" id="gcap"></div><svg id="bg" viewBox="0 0 ${GW} ${GH}" role="img" aria-label="${esc(b.model)} 그래프"></svg></div>`;
  if (b.cat === 'eq') {
    const band = b.bands[S.band];
    return graph + `
    <div class="seg light" role="group" aria-label="밴드">${['저음','중음','고음'].map((n,i)=>`<button class="${S.band===i?'on':''}" data-act="band" data-i="${i}">${n}</button>`).join('')}</div>
    <div class="params">
      ${paramRow('eqf','주파수',fmtF(band.f),Math.round(f2s(band.f)*1000),c.color)}
      ${paramRow('eqg','게인',fmtG(band.g),Math.round((band.g+12)/24*1000),c.color)}
      ${paramRow('eqq','Q (폭)',band.q.toFixed(2),Math.round(Math.log(band.q/0.2)/Math.log(20)*1000),c.color)}
    </div>
    <div class="params" style="background:var(--card);border-radius:22px;padding:18px">
      ${paramRow('p-lc','Low Cut',fmtVal(CUT_LC,b.cut.lc),Math.round(norm(CUT_LC,b.cut.lc)*1000),c.color)}
      ${paramRow('p-hc','High Cut',fmtVal(CUT_HC,b.cut.hc),Math.round(norm(CUT_HC,b.cut.hc)*1000),c.color)}
    </div>`;
  }
  return graph + `
  <div class="params" style="background:var(--card);border-radius:22px;padding:18px">
    ${defsFor(b).map(d=>paramRow('p-'+d.k,d.label,fmtVal(d,b.p[d.k]),Math.round(norm(d,b.p[d.k])*1000),c.color)).join('')}
  </div>`;
}
function paramRow(id,label,val,v,color){
  return `<div class="param"><div class="hd"><label for="${id}">${label}</label><span class="v" id="${id}-v">${val}</span></div>
  <input type="range" id="${id}" min="0" max="1000" step="1" value="${v}" style="accent-color:${color}"></div>`;
}

    + (SONGS.length < 10 ? `<button class="song add" data-act="songAdd" aria-label="곡 추가">${I.plus}</button>` : '');
  const circ = Array.from({length:n}, (_, k) => `<i class="${k === 0 && (!cur || cur.accent) ? 'a' : ''}"></i>`).join('');

  </div>`;
}

/* ---------- 메트로놈: 오디오 시계에 미리 예약 ---------- */
const MET = { on:false, idx:-1, sel:0, beat:0, next:0, timer:0, q:[], vis:-1, raf:0, gain:null, wake:null, noise:null };
function audioCtx(){
  if (!RTA.ctx) RTA.ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (RTA.ctx.state === 'suspended') RTA.ctx.resume();
  return RTA.ctx;
}
function metClick(t, acc, kind){
  const ctx = RTA.ctx;
  if (!MET.gain) { MET.gain = ctx.createGain(); MET.gain.gain.value = 0.9; MET.gain.connect(ctx.destination); }
  const o = ctx.createOscillator(), g = ctx.createGain();
  if (kind === 'wood') { o.type = 'triangle'; o.frequency.setValueAtTime(acc ? 1250 : 880, t); o.frequency.exponentialRampToValueAtTime(acc ? 900 : 640, t + 0.05); }
  else { o.type = 'square'; o.frequency.setValueAtTime(acc ? 2000 : 1400, t); }
  const peak = (acc ? 0.5 : 0.32) * (kind === 'wood' ? 1.2 : 0.6), len = kind === 'wood' ? 0.07 : 0.035;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + 0.002); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
  o.connect(g); g.connect(MET.gain); o.start(t); o.stop(t + len + 0.02);
}
function metSched(){
  const ctx = RTA.ctx, s = SONGS[MET.idx]; if (!s || !MET.on) return;
  const n = SIG_N[s.sig] || 4, spb = 60 / s.bpm;
  if (MET.next < ctx.currentTime) MET.next = ctx.currentTime + 0.03;
  while (MET.next < ctx.currentTime + 0.12) {
    // 블루투스 보정: 소리를 그만큼 앞당겨 예약하고, 화면은 원래 박에 맞춤
    const lead = (s.bt || 0) / 1000, at = Math.max(ctx.currentTime + 0.005, MET.next - lead);
    if (s.sound !== 'none') metClick(at, MET.beat === 0 && s.accent, s.sound);
    MET.q.push({ t: MET.next, b: MET.beat });
    MET.beat = (MET.beat + 1) % n; MET.next += spb;
  }
}
function metPaint(){
  const el = document.getElementById('cir'); if (!el) return;
  [...el.children].forEach((c, k) => {
    c.classList.toggle('hit', k === MET.vis);
    c.classList.toggle('past', MET.vis >= 0 && k < MET.vis);
  });
}
function metDraw(){
  MET.raf = 0; if (!MET.on) return;
  MET.raf = requestAnimationFrame(metDraw);
  const ctx = RTA.ctx, now = ctx.currentTime - (ctx.outputLatency || ctx.baseLatency || 0);
  let changed = false;
  while (MET.q.length && MET.q[0].t <= now) { MET.vis = MET.q.shift().b; changed = true; }
  if (changed) metPaint();
}
async function wakeOn(){ try { if ('wakeLock' in navigator && !MET.wake) { MET.wake = await navigator.wakeLock.request('screen'); MET.wake.addEventListener('release', () => { MET.wake = null; }); } } catch(e) {} }
function wakeOff(){ try { if (MET.wake) MET.wake.release(); } catch(e) {} MET.wake = null; }
function metStart(i){
  const s = SONGS[i]; if (!s) return;
  audioCtx();
  MET.on = true; MET.idx = i; MET.sel = i; MET.beat = 0; MET.q = []; MET.vis = -1; MET.next = RTA.ctx.currentTime + 0.1;
  S.bpm = s.bpm;                                   // 스톰프 탭 템포로 같은 BPM (연습 모드라 실제 전송은 없음)
  if (s.preset >= 0 && s.preset !== S.preset && PRE[s.preset] && !PRE[s.preset].empty) loadPreset(s.preset);
  clearInterval(MET.timer); MET.timer = setInterval(metSched, 25); metSched();
  if (!MET.raf) MET.raf = requestAnimationFrame(metDraw);
  wakeOn();
}
function metStop(){
  MET.on = false; clearInterval(MET.timer); MET.timer = 0; MET.q = []; MET.vis = -1;
  if (MET.raf) { cancelAnimationFrame(MET.raf); MET.raf = 0; }
  wakeOff();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && MET.on) wakeOn(); });

root.addEventListener('pointerdown', () => { try { if (RTA.ctx && RTA.ctx.state === 'suspended') RTA.ctx.resume(); } catch(e) {} }, true);
const devShort = l => { if (!l) return '마이크'; const u = /usb|stomp|line ?6|helix/i.test(l); let t = l.replace(/\(.*?\)/g, '').trim(); if (t.length > 16) t = t.slice(0, 15) + '…'; return (u ? 'USB · ' : '') + t; };
/* ---------- 길게 누르기 ---------- */
let lp = null, lpFired = false;
root.addEventListener('pointerdown', e => {
  lpFired = false;
  const t = e.target.closest && e.target.closest('[data-lp]'); if (!t || S.sedit) return;
  lp = { t, x: e.clientX, y: e.clientY, id: e.pointerId, timer: setTimeout(() => {
    lpFired = true; lp = null; try { navigator.vibrate && navigator.vibrate(15); } catch(err) {}
    const f = ACT[t.dataset.lp]; if (f) f(t);
  }, 450) };
});
root.addEventListener('pointermove', e => { if (lp && e.pointerId === lp.id && Math.hypot(e.clientX - lp.x, e.clientY - lp.y) > 10) { clearTimeout(lp.timer); lp = null; } });
const lpEnd = () => { if (lp) { clearTimeout(lp.timer); lp = null; } if (lpFired) setTimeout(() => { lpFired = false; }, 80); };
root.addEventListener('pointerup', lpEnd); root.addEventListener('pointercancel', lpEnd);
root.addEventListener('contextmenu', e => { if (e.target.closest && e.target.closest('[data-lp],.sedit')) e.preventDefault(); });

/* ---------- 블록 줄 편집: 옆으로 끌어서 순서 바꾸기 ---------- */
let sd = null;
root.addEventListener('pointerdown', e => {
  if (!S.sedit) return;
  const b = e.target.closest && e.target.closest('.sedit .blk'); if (!b || e.target.closest('.x')) return;
  e.preventDefault();
  const els = [...document.querySelectorAll('.sedit .blk')];
  sd = { el: b, from: +b.dataset.i, x0: e.clientX, id: e.pointerId, cx: els.map(x => { const r = x.getBoundingClientRect(); return r.left + r.width/2; }), moved: false };
  b.classList.add('lift');
  try { b.setPointerCapture(e.pointerId); } catch(err) {}
});
root.addEventListener('pointermove', e => {
  if (!sd || e.pointerId !== sd.id) return;
  const dx = e.clientX - sd.x0; if (Math.abs(dx) > 4) sd.moved = true;
  sd.el.style.transform = `translate(${dx}px,-6px) rotate(-3deg)`;
});
root.addEventListener('pointerup', e => {
  if (!sd || e.pointerId !== sd.id) return;
  const x = sd.cx[sd.from] + (e.clientX - sd.x0); let to = 0, best = 1e9;
  sd.cx.forEach((c, i) => { const d = Math.abs(c - x); if (d < best) { best = d; to = i; } });
  const from = sd.from; sd = null;
  if (from !== to) { const [m] = S.draft.splice(from, 1); S.draft.splice(to, 0, m); try { navigator.vibrate && navigator.vibrate(8); } catch(err) {} }
  render();
});
root.addEventListener('pointercancel', () => { if (sd) { sd = null; render(); } });

function render(){
  const v = { main:vMain, edit:vEdit, add:vAdd, block:vBlock, presets:vPresets, rta:vRta }[S.screen] || vMain;
  root.innerHTML = v();
  root.classList.toggle('mainv', S.screen === 'main');
  if (S.screen === 'block' || S.sheet === 'block') drawGraph();
  if (document.getElementById('rtaCv')) rtaStart(); else rtaStop();
  metPaint();
  const sh = document.getElementById('sheet'), rt = root.querySelector('.rta');
  if (sh && rt && S.sheet === 'block') sh.style.maxHeight = Math.max(window.innerHeight*0.5, window.innerHeight - rt.getBoundingClientRect().bottom - 6) + 'px';
  if (S.screen === 'add') {
    const q = document.getElementById('q');
    q.addEventListener('input', () => { S.addQuery = q.value; const pos = q.selectionStart; render(); const n = document.getElementById('q'); n.focus(); try{ n.setSelectionRange(pos,pos); }catch(e){} });
  }
}
function go(screen){ S.screen = screen; S.sheet = null; S.menu = null; render(); window.scrollTo(0,0); }

/* ---------- 블록 그래프 (블록 종류마다 다른 그림, 점을 끌어서 조절) ---------- */
const GW = 340, GH = 220, GL = 34, GR = 326, GT = 22, GB = 192;
const FMIN = 20, FMAX = 20000, GMAX = 12;
const f2s = f => Math.log10(f/FMIN)/Math.log10(FMAX/FMIN);
const s2f = s => FMIN*Math.pow(FMAX/FMIN, s);
const fx = f => GL + f2s(f)*(GR-GL);
const xf = x => s2f(Math.max(0, Math.min(1, (x-GL)/(GR-GL))));
const gy = g => (GT+GB)/2 - g*((GB-GT)/2)/GMAX;
const yg = y => ((GT+GB)/2 - y)/((GB-GT)/2)*GMAX;
const cl = (v,a,b) => Math.max(a, Math.min(b, v));
const fmtF = f => f >= 1000 ? (f/1000).toFixed(f>=10000?1:2).replace(/\.?0+$/,'') + ' kHz' : Math.round(f) + ' Hz';
const fmtG = g => (g>0?'+':g<0?'−':'') + Math.abs(g).toFixed(1) + ' dB';
const cutDb = (f,lc,hc) => (lc > 20.5 ? -10*Math.log10(1+Math.pow(lc/f,4)) : 0) + (hc < 19999 ? -10*Math.log10(1+Math.pow(f/hc,4)) : 0);
const peak = (f,fc,g,q) => { const o = Math.log2(f/fc), w = 0.9/q; return g*Math.exp(-0.5*(o/w)*(o/w)); };
const shelfLo = (f,fc,g) => g/(1+Math.pow(f/fc,2));
const shelfHi = (f,fc,g) => g/(1+Math.pow(fc/f,2));
function curBlock(){ return S.chain.find(x => x.uid === S.blockUid); }
const T = (x,y,txt,anchor,fill) => `<text x="${x}" y="${y}" fill="${fill||'#9BA1AC'}" font-size="10" font-family="Inter" text-anchor="${anchor||'middle'}">${txt}</text>`;
const axes = () => `<path d="M${GL} ${GT}V${GB}H${GR}" fill="none" stroke="#2A2D33"/>`;
function freqGrid(){ return [100,1000,10000].map(f=>`<line x1="${fx(f)}" y1="${GT}" x2="${fx(f)}" y2="${GB}" stroke="#23262C"/>`+T(fx(f),GB+16,f>=1000?f/1000+'k':f)).join('')
  + `<line x1="${GL}" y1="${gy(0)}" x2="${GR}" y2="${gy(0)}" stroke="#33373F"/>` + T(GL-4,gy(6)+3,'+6','end') + T(GL-4,gy(-6)+3,'−6','end'); }
function curvePath(fn){ let d=''; for (let i=0;i<=160;i++){ const x = GL + i/160*(GR-GL), y = cl(gy(fn(xf(x))), GT+1, GB-1); d += (i?'L':'M')+x.toFixed(1)+','+y.toFixed(1); } return d; }

const GRAPH = {
  eq(b, col){
    const cut = b.cut || {lc:20,hc:20000};
    const fn = f => b.bands.reduce((s,bd)=>s+peak(f,bd.f,bd.g,bd.q),0) + cutDb(f,cut.lc,cut.hc), d = curvePath(fn);

      if (MET.on && MET.idx === S.songI) S.bpm = s.bpm; document.getElementById('sBpm').textContent = s.bpm; }
  },
  songSig: t => { const s = SONGS[S.songI]; s.sig = t.dataset.v; saveSongs(); if (MET.on && MET.idx === S.songI) { MET.beat = 0; MET.vis = -1; } render(); },
  songAccent: () => { const s = SONGS[S.songI]; s.accent = !s.accent; saveSongs(); render(); },
  songSound: t => { SONGS[S.songI].sound = t.dataset.v; saveSongs(); render(); },
  songBt: t => { const s = SONGS[S.songI]; s.bt = Math.max(0, Math.min(400, (s.bt||0) + (+t.dataset.d))); saveSongs(); document.getElementById('sBt').textContent = s.bt ? '−' + s.bt + ' ms' : '0 ms'; },
  songDel: () => {
    const i = S.songI; if (MET.on && MET.idx === i) metStop();
    SONGS.splice(i, 1); saveSongs();
    if (MET.idx > i) MET.idx--; else if (MET.idx === i) MET.idx = -1;
    MET.sel = Math.max(0, Math.min(MET.sel > i ? MET.sel-1 : MET.sel, SONGS.length-1));
    S.sheet = null; render();
  },
  pickPreset: t => { loadPreset(+t.dataset.i); toast(PID(S.preset) + ' ' + PRESETS[S.preset] + '(으)로 전환 · 연습 모드'); go('main'); },
  snap: t => { S.snap = +t.dataset.i; render(); },
  toggleBlock: t => { const u = +t.dataset.uid, m = S.off[S.snap]; if (m[u]) delete m[u]; else m[u] = true; render(); },
  openBlock: t => { S.blockUid = +t.dataset.uid; S.band = 1; go('block'); },
  band: t => { S.band = +t.dataset.i; render(); },
  tuner: () => toast('튜너는 페달을 연결해야 쓸 수 있어요'),
  tap: () => {
    const now = performance.now(); S.taps = S.taps.filter(x => now - x < 2500); S.taps.push(now);
    if (S.taps.length >= 2) { const iv = []; for (let i = 1; i < S.taps.length; i++) iv.push(S.taps[i]-S.taps[i-1]);
      const avg = iv.slice(-4).reduce((a,b)=>a+b,0)/Math.min(iv.length,4); S.bpm = Math.max(30, Math.min(300, Math.round(60000/avg))); }
    const el = document.getElementById('bpm'); if (el) { el.textContent = S.bpm; const tl = el.closest('.tile'); if (tl) tl.classList.toggle('link', MET.idx >= 0 && SONGS[MET.idx] && SONGS[MET.idx].bpm === S.bpm); }
  },
  allowEdit: () => { S.allowEdit = !S.allowEdit; render(); },
  rtaSrc: async t => {
    const v = t.dataset.v, id = t.dataset.id;
    if (v === RTA.src && (v !== 'mic' || id === undefined || id === RTA.devId)) { S.menu = null; render(); return; }
    if (id !== undefined) RTA.devId = id || null;
    if (RTA.ctx && RTA.ctx.state === 'suspended') RTA.ctx.resume();
    S.menu = null; RTA.src = v; render();
    try { await rtaConnect(); render(); } catch (e) { RTA.err = (e && e.name === 'NotAllowedError') ? '마이크 사용을 허용해 주세요' : '마이크를 열 수 없어요'; toast(RTA.err); }
  },
  rtaSpeed: t => { RTA.speed = t.dataset.v; S.menu = null; if (RTA.an) RTA.an.smoothingTimeConstant = SPEED[RTA.speed]; render(); },
  rtaToggle: t => {
    const k = t.dataset.k; RTA[k] = !RTA[k];
    if (k === 'listen' && RTA.out) RTA.out.gain.value = RTA.listen ? 0.8 : 0;
    render();
  },
  closeTip: t => { tipsClosed[t.dataset.k] = true; saveTips(); render(); },
  showTips: () => { tipsClosed = {}; saveTips(); render(); toast('모든 화면의 조작 안내를 다시 보여 줄게요'); },
  startEdit: () => {
    if (!S.allowEdit) { toast("연결·프리셋 화면에서 '체인 편집 허용'을 켜 주세요"); return; }
    S.draft = clone(S.chain); go('edit');
  },
  cancelEdit: () => { S.draft = null; go('main'); },
  doneEdit: () => {
    if (dspOf(S.draft) > 100) { toast('DSP가 100%를 넘어요. 블록을 줄여 주세요'); return; }
    S.chain = S.draft; S.draft = null;
    const alive = new Set(S.chain.map(b => b.uid));
    S.off.forEach(m => Object.keys(m).forEach(k => { if (!alive.has(+k)) delete m[k]; }));
    toast('체인 적용됨 · 연습 모드라 페달에는 보내지 않았어요'); go('main');
  },
  move: t => { const i = +t.dataset.i, j = i + (+t.dataset.d), d = S.draft; if (j < 0 || j >= d.length) return; [d[i], d[j]] = [d[j], d[i]]; render(); },
  remove: t => { const b = S.draft.splice(+t.dataset.i, 1)[0]; render(); toast(b.model + ' 삭제 · 취소를 누르면 되돌아가요'); },
  insertAt: t => { S.insertAt = +t.dataset.i; S.addQuery = ''; S.addModel = CATS[S.addCat].models[0]; go('add'); },
  addCat: t => { S.addCat = t.dataset.k; S.addModel = CATS[S.addCat].models[0]; render(); },
  pickModel: t => { S.addCat = t.dataset.k; S.addModel = t.dataset.m; render(); },
  addBlock: () => {
    if (S.draft.length >= MAX_BLOCKS) { toast('블록은 최대 8개까지예요'); return; }
    S.draft.splice(S.insertAt, 0, makeBlock(S.addCat, S.addModel)); toast(S.addModel + ' 추가'); go(S.sedit ? 'main' : 'edit');
  }
};
root.addEventListener('click', e => {
  if (lpFired) { lpFired = false; return; }
  const t = e.target.closest('[data-act]');
  if (S.menu && (!t || t.dataset.act !== 'menu' && !t.closest('.pop'))) { S.menu = null; if (!t) { render(); return; } }
  if (!t || !root.contains(t) || t.disabled) return;
  const f = ACT[t.dataset.act]; if (f) f(t);
});

/* ---------- 테스트 화면 ↔ 인터페이스 전환 ---------- */
const KEY = 'stompUltra.view';
function setView(v){
  document.body.classList.toggle('v-iface', v === 'iface');
  document.body.classList.toggle('v-test', v !== 'iface');
  try { localStorage.setItem(KEY, v); } catch(e) {}
  if (v === 'iface') render();
  window.scrollTo(0,0);
}
document.getElementById('toIface').addEventListener('click', () => setView('iface'));
let start = 'test';
try { if (new URLSearchParams(location.search).get('view') === 'iface' || localStorage.getItem(KEY) === 'iface') start = 'iface'; } catch(e) {}
setView(start);
})();
</script>
